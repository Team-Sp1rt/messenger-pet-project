name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # 1. Скачать код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установить Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 3. Запустить PostgreSQL через Docker Compose
      - name: Start PostgreSQL
        run: docker compose up -d

      # 4. Проверить, что контейнер поднялся
      - name: Show running containers
        run: docker ps

      # 5. Подождать готовности базы
      - name: Wait for PostgreSQL
        run: |
          until docker compose exec postgres pg_isready -U postgres
          do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      # 6. Запустить тесты
      - name: Run tests
        run: mvn test

      # 7. Собрать проект
      - name: Verify build
        run: mvn verify

      # 8. Остановить контейнеры
      - name: Stop Docker
        if: always()
        run: docker compose down